<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zaawansowany Kalkulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #acb6e5);
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav button {
            background: #fff;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        nav button.selected {
            background-color: #007AFF;
            color: white;
        }

        .content {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .content.active {
            display: flex !important;
        }

        #calculator, #plotter, #history, #settings {
            background-color: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        #display {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            padding-right: 10px;
            margin-bottom: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        .button {
            width: 56px;
            height: 56px;
            font-size: 20px;
            margin: 3px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .number { background-color: #e0e0e0; }
        .operator { background-color: #ff9500; color: #fff; }
        .equal { background-color: #34c759; color: #fff; height: 118px; }
        .clear { background-color: #ff3b30; color: #fff; width: 118px; }
        .special { background-color: #007AFF; color: #fff; }

        #functionInput {
            width: 300px;
            font-size: 18px;
            padding: 10px;
            margin-right: 10px;
            border-radius: 5px;
        }

        canvas {
            margin-top: 20px;
        }

        #historyList {
            list-style-type: none;
            padding: 0;
        }

        #historyList li {
            margin: 5px 0;
        }
    </style>
</head>
<body>

<nav>
    <button onclick="switchMode('calculator')">🧮 Kalkulator</button>
    <button onclick="switchMode('plotter')">📈 Rysuj funkcję</button>
    <button onclick="switchMode('history')">📜 Historia</button>
    <button onclick="switchMode('settings')">⚙️ Ustawienia</button>
</nav>

<div id="calculator" class="content active">
    <div>
        <input type="text" id="display" />
        <br>
        <button class="button clear" onclick="clearDisplay()">C</button>
        <button class="button special" onclick="percent()">%</button>
        <button class="button special" onclick="sqrt()">√</button>
        <button class="button operator" onclick="press('/')">÷</button>
        <br>
        <button class="button number" onclick="press('7')">7</button>
        <button class="button number" onclick="press('8')">8</button>
        <button class="button number" onclick="press('9')">9</button>
        <button class="button operator" onclick="press('*')">×</button>
        <br>
        <button class="button number" onclick="press('4')">4</button>
        <button class="button number" onclick="press('5')">5</button>
        <button class="button number" onclick="press('6')">6</button>
        <button class="button operator" onclick="press('-')">−</button>
        <br>
        <button class="button number" onclick="press('1')">1</button>
        <button class="button number" onclick="press('2')">2</button>
        <button class="button number" onclick="press('3')">3</button>
        <button class="button operator" onclick="press('+')">+</button>
        <br>
        <button class="button number" onclick="press('0')">0</button>
        <button class="button number" onclick="press('.')">.</button>
        <button class="button special" onclick="toggleSign()">±</button>
        <button class="button equal" onclick="calculate()">=</button>
    </div>
</div>

<div id="plotter" class="content">
    <div>
        <input type="text" id="functionInput" placeholder="np. sin(x), x^2, cos(x)" />
        <button onclick="plotFunction()">Rysuj</button>
        <canvas id="chart" width="400" height="300"></canvas>
    </div>
</div>

<div id="history" class="content">
    <div>
        <h2>Historia obliczeń</h2>
        <ul id="historyList"></ul>
    </div>
</div>

<div id="settings" class="content">
    <div>
        <h2>Ustawienia</h2>
        <p>Opcje ustawień będą dostępne w przyszłych aktualizacjach.</p>
    </div>
</div>

<script>
    function switchMode(mode) {
        document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
        document.getElementById(mode).classList.add('active');

        document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('selected'));
        const index = ['calculator', 'plotter', 'history', 'settings'].indexOf(mode);
        if (index >= 0) {
            document.querySelectorAll('nav button')[index].classList.add('selected');
        }
    }

    const display = document.getElementById('display');
    const historyList = document.getElementById('historyList');

    function press(value) {
        if (value === '.' && display.value.slice(-1) === '.') return;
        display.value += value;
    }

    function calculate() {
        try {
            if (display.value.trim() === '') return;
            const result = math.evaluate(display.value);
            display.value = Number(result.toFixed(10)).toString();
            addToHistory(display.value);
        } catch {
            display.value = 'Błąd';
        }
    }

    function clearDisplay() {
        display.value = '';
    }

    function sqrt() {
        const value = parseFloat(display.value);
        if (!isNaN(value) && value >= 0) {
            display.value = Math.sqrt(value).toFixed(10).replace(/\.?0+$/, '');
        } else {
            display.value = 'Błąd';
        }
    }

    function toggleSign() {
        if (display.value === '') return;
        let lastNumberMatch = display.value.match(/(-?\d+\.?\d*)$/);
        if (lastNumberMatch) {
            let num = parseFloat(lastNumberMatch[0]);
            let negated = (num * -1).toString();
            display.value = display.value.slice(0, -lastNumberMatch[0].length) + negated;
        }
    }

    function percent() {
        const value = parseFloat(display.value);
        if (!isNaN(value)) {
            display.value = (value / 100).toString();
        }
    }

    function addToHistory(entry) {
        const li = document.createElement('li');
        li.textContent = entry;
        historyList.appendChild(li);
    }

    let chart;
    function plotFunction() {
        const input = document.getElementById("functionInput").value;
        const expr = input;
        const xValues = [], yValues = [];

        for (let x = -10; x <= 10; x += 0.2) {
            try {
                const scope = { x };
                const y = math.evaluate(expr, scope);
                xValues.push(x.toFixed(2));
                yValues.push(y);
            } catch {
                xValues.push(x.toFixed(2));
                yValues.push(null);
            }
        }

        if (chart) {
            chart.destroy();
        }

        const ctx = document.getElementById('chart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: xValues,
                datasets: [{
                    label: `f(x) = ${expr}`,
                    data: yValues,
                    borderColor: '#007AFF',
                    backgroundColor: 'rgba(0,122,255,0.1)',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: true,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'x'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'f(x)'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false
                    }
                }
            }
        });
    }
</script>

</body>
</html>
